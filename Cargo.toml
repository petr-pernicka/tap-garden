[package]
name = "tap-garden"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.8" }
rand = "0.10"

[profile.release-full]
inherits = "release"
codegen-units = 1
lto = "thin"

[profile.release-debug]
inherits = "release"
debug-assertions = true
overflow-checks = true
panic = "unwind"

[[bench]]
name = "mixture_flow"
harness = false

[[bench]]
name = "sssp"
harness = false
